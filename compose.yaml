# S3-compatible server for the integration tests (stands in for R2).
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: r2-storage-test
      MINIO_ROOT_PASSWORD: r2-storage-test-secret
    ports:
      - "127.0.0.1:19000:9000"
