# S3-compatible server for the integration tests (stands in for R2): VersityGW, which checks
# signatures like R2 does. (MinIO no longer publishes Docker images.)
services:
  s3:
    image: versity/versitygw:v1.9.0
    command: posix /tmp
    environment:
      ROOT_ACCESS_KEY: r2-storage-test
      ROOT_SECRET_KEY: r2-storage-test-secret
    ports:
      - "127.0.0.1:19000:7070"
